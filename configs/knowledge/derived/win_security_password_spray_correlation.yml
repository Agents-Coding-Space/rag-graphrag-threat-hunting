# Project-defined derived rule, not an external SigmaHQ input.
# Input MUST be normalized-auth-attempt/v1 AFTER conservative 4625/4776 pairing.
# SourceContext is serialized workstation/IP + domain + endpoint/caller context.
# Unknown-source and ambiguous views are excluded from this stream.
# The production Sigma evaluator does not support this custom taxonomy/correlation.
title: Offline Deduplicated Authentication Failures
name: offline_authentication_failures
taxonomy: project_authentication_attempt_v1
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4625
            - 4776
        Outcome: failure
    condition: selection
---
title: Project Suspected Password Spraying Across Distinct Accounts
id: 8146a24e-c271-4d34-a679-6a361f71ccab
status: experimental
description: >-
    At least five distinct target accounts fail from the same resolved source
    context within a sliding minute after endpoint/DC observation deduplication.
    A candidate for review, not proof of a shared password or successful attack.
author: Graduation project offline pipeline
date: 2026-10-30
references:
    - https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html
taxonomy: project_authentication_attempt_v1
correlation:
    type: value_count
    rules:
        - offline_authentication_failures
    group-by:
        - SourceContext
    timespan: 1m
    condition:
        field: TargetUserName
        gte: 5
tags:
    - attack.credential-access
    - attack.t1110.003
falsepositives:
    - Authorized simulations or account validation scripts
    - Misconfigured batch authentication using multiple accounts
level: medium
