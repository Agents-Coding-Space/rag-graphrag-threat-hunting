[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-graphrag-threat-hunting"
version = "0.1.0"
description = "Mordor inspection tooling for a RAG, GraphRAG, and LLM threat-hunting research project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "sentence-transformers==6.1.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
